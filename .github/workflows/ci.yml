name: MercadinhoSys CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  oracle-db-split:
    name: Oracle Private Database Cutover Safety
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify rollback and write preservation
        run: python -m unittest discover -s infra/oracle -p test_db_split.py -v
      - name: Verify Compose and PostgreSQL forwarding backup restore
        run: python infra/oracle/verify-db-split-ci.py

  backend-tests:
    name: Backend Pytest & Multi-Tenant Audit
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: audit_security_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest Test Suite
        env:
          FLASK_ENV: testing
          AUDIT_DATABASE_URL: 'sqlite:///:memory:'
          JWT_SECRET_KEY: ci_test_jwt_secret_key_12345
          SKIP_DB_SETUP: "true"
        run: |
          pytest backend/tests --cov=backend/app --cov-report=term-missing

      - name: PostgreSQL Checkout Concurrency and Tenant Audit
        env:
          FLASK_ENV: testing
          AUDIT_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/audit_security_ci
          JWT_SECRET_KEY: ci_test_jwt_secret_key_12345
          SKIP_DB_SETUP: "true"
        run: |
          pytest backend/tests/test_postgres_checkout_concurrency.py backend/tests/test_finance_postgres_concurrency.py backend/tests/test_finance_release.py backend/tests/test_devops_finance_review.py backend/tests/test_tenant_isolation.py backend/tests/test_routes_multi_tenant_guard.py backend/tests/test_fornecedores_listing_response.py backend/tests/test_fin01_boleto_payments.py -q

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/mercadinhosys-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend/mercadinhosys-frontend
        run: npm ci

      - name: Typecheck & Vite Build
        working-directory: ./frontend/mercadinhosys-frontend
        run: npm run build
