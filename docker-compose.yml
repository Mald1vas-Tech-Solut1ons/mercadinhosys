version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mercadinhosys-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mercadinhosys
      POSTGRES_USER: mercadinho_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mercadinho_secure_pass_2024}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mercadinho_user -d mercadinhosys" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercadinhosys-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mercadinhosys-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Comando sobrescrito para forçar o auto-reload (hot-reload) durante o desenvolvimento local
    command: ["gunicorn", "--reload", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-", "run:app"]
    
    environment:
      # Flask
      FLASK_APP: run.py
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_DEBUG: 1
      PORT: 5000
      
      # Database (senha vem de ${DB_PASSWORD} — fonte única, igual ao serviço postgres)
      DATABASE_URL: postgresql://mercadinho_user:${DB_PASSWORD:-mercadinho_secure_pass_2024}@postgres:5432/mercadinhosys
      MULTI_TENANT_MODE: "true"

      # Rate-limiting com storage compartilhado (Redis) — vale entre todos os workers
      RATELIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/1

      # Security
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}

      # Email (opcional)
      MAIL_SERVER: ${MAIL_SERVER:-smtp.zoho.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-true}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/instance/uploads
      - backend_logs:/app/logs
      - backend_backups:/app/backups
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mercadinhosys-network

  # Frontend (Vite dev com hot-reload)
  frontend:
    image: node:20-alpine
    container_name: mercadinhosys-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:5173"
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend/mercadinhosys-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_TARGET=http://mercadinhosys-backend:5000
      - VITE_HMR_CLIENT_PORT=80
      - CHOKIDAR_USEPOLLING=true
    networks:
      - mercadinhosys-network

  # Redis (opcional - para cache e sessões)
  redis:
    image: redis:7-alpine
    container_name: mercadinhosys-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mercadinhosys-network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  backend_backups:
    driver: local
  redis_data:
    driver: local

networks:
  mercadinhosys-network:
    driver: bridge
